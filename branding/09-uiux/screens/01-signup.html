<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — Menu Master NG</title>
<link rel="stylesheet" href="_app.css">
<style>
  .auth { min-height: 100vh; display: grid; align-content: start; gap: 22px; padding: 28px 20px 40px; max-width: 440px; margin: 0 auto; }
  .auth .logo { height: 44px; width: auto; justify-self: start; }
  .auth h1 { font-size: 26px; font-weight: 700; }
  .auth .sub { color: var(--mm-muted); margin: 6px 0 0; font-size: 15px; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--mm-muted); font-size: 13px; }
  .or::before, .or::after { content: ''; height: 1px; background: var(--mm-line); }
  .legal { font-size: 12.5px; color: var(--mm-muted); line-height: 1.5; }
  .legal a { color: var(--mm-accent); font-weight: 600; }
</style></head>
<body data-section="none">
<div class="auth">
  <img class="logo" src="../../03-logo/svg/lockup-horizontal.svg" alt="Menu Master NG">
  <div><h1>Start your 14 days free</h1><p class="sub">No card needed. Your records stay yours.</p></div>
  <a class="btn secondary full"><i data-i="google"></i> Continue with Google</a>
  <div class="or">or with email</div>
  <form style="display:grid;gap:14px">
    <div class="field"><label>Email</label><div class="input ph">you@example.com</div></div>
    <div class="field"><label>Password</label><div class="input focus">••••••••••<span class="suf">Show</span></div><p class="hint">At least 8 characters.</p></div>
    <label class="check"><i class="on"><i data-i="check"></i></i><span>Send me the occasional tip on pricing. No spam, unsubscribe any time.</span></label>
    <a class="btn primary full">Create my account <i data-i="arrow"></i></a>
  </form>
  <p class="legal">By continuing you agree to the <a>Terms</a> and <a>Privacy policy</a>.</p>
  <p class="hint" style="text-align:center">Already have an account? <a style="color:var(--mm-accent);font-weight:600">Log in</a></p>
</div>
<script src="_shell.js"></script>
</body></html>
