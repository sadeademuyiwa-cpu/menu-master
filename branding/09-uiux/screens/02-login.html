<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Menu Master NG</title>
<link rel="stylesheet" href="_app.css">
<style>
  .auth { min-height: 100vh; display: grid; align-content: start; gap: 22px; padding: 28px 20px 40px; max-width: 440px; margin: 0 auto; }
  .auth .logo { height: 44px; width: auto; justify-self: start; }
  .auth h1 { font-size: 26px; font-weight: 700; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--mm-muted); font-size: 13px; }
  .or::before, .or::after { content: ''; height: 1px; background: var(--mm-line); }
</style></head>
<body data-section="none">
<div class="auth">
  <img class="logo" src="../../03-logo/svg/lockup-horizontal.svg" alt="Menu Master NG">
  <div><h1>Welcome back</h1><p class="hint" style="font-size:15px;margin-top:6px">Log in to Ada Kitchen and 1 other business.</p></div>
  <div class="notice bad"><i data-i="alert"></i><span>That email and password don't match. Check for a typo or reset your password.</span></div>
  <form style="display:grid;gap:14px">
    <div class="field"><label>Email</label><div class="input">ada@adakitchen.ng</div></div>
    <div class="field"><label>Password</label><div class="input err">••••••••<span class="suf">Show</span></div></div>
    <a class="btn primary full">Log in</a>
    <a class="btn ghost" style="justify-self:center">Forgot your password?</a>
  </form>
  <div class="or">or</div>
  <a class="btn secondary full"><i data-i="google"></i> Continue with Google</a>
  <p class="hint" style="text-align:center">New here? <a style="color:var(--mm-accent);font-weight:600">Start 14 days free</a></p>
</div>
<script src="_shell.js"></script>
</body></html>
