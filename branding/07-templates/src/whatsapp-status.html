<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="render" content="1080x1920">
<title>WhatsApp status / Instagram story</title>
<link rel="stylesheet" href="../../_brand.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative; background: #0f5e3c; color: #fff; }
  .photo { position: absolute; inset: 0 0 42% 0; background: url('../../06-imagery/samples/pexels-36707708.jpg') center 30%/cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(15 94 60 / 0) 30%, #0f5e3c 60%); }
  .brand { position: absolute; top: 120px; left: 80px; height: 72px; }
  .copy { position: absolute; left: 80px; right: 80px; bottom: 200px; }
  .kicker { font: 700 28px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: #d4a020; margin-bottom: 28px; }
  h1 { font-size: 112px; font-weight: 800; line-height: .98; }
  p { font-size: 40px; line-height: 1.3; margin: 36px 0 0; color: rgb(255 255 255 / .9); }
  .btn { display: inline-block; margin-top: 56px; background: #fff; color: #0f5e3c; font: 700 36px/1 var(--font-ui); padding: 32px 44px; border-radius: 999px; }
  .swipe { position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; font: 600 26px/1 var(--font-ui); color: rgb(255 255 255 / .7); letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <div class="photo"></div><div class="fade"></div>
  <img class="brand" src="../../03-logo/svg/lockup-horizontal-reversed.svg" alt="Menu Master NG">
  <div class="copy">
    <div class="kicker">One pot. How many plates?</div>
    <h1>Busy is not the same as profitable.</h1>
    <p>Know what every plate really costs, from your own market receipts. On your phone, 14 days free.</p>
    <span class="btn">Start free at menumasterng.com</span>
  </div>
  <div class="swipe">Link in bio · Tap to reply</div>
</body></html>
