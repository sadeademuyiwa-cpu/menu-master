<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="render" content="1004x1340@2">
<title>Business card, 85 × 55 mm, front and back (300 dpi at @3)</title>
<link rel="stylesheet" href="../../_brand.css">
<style>
  body { width: 1004px; padding: 0; background: #e6e9e6; display: grid; gap: 40px; padding: 0; }
  .card { width: 1004px; height: 650px; border-radius: 24px; overflow: hidden; position: relative; padding: 72px; }
  .front { background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
  .front img { height: 64px; width: auto; align-self: flex-start; }
  .name { font: 800 44px/1.1 var(--font-display); letter-spacing: -.02em; }
  .role { font: 500 22px/1.3 var(--font-ui); color: #66706a; margin-top: 8px; }
  .contact { display: grid; gap: 8px; font: 500 22px/1.3 var(--font-ui); }
  .contact span { color: #1f7a52; }
  .back { background: #0f5e3c; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 36px; }
  .back img { height: 190px; }
  .back p { margin: 0; font: 700 34px/1.25 var(--font-display); letter-spacing: -.01em; max-width: 720px; }
  .back small { font: 600 20px/1 var(--font-ui); color: #d4a020; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <div class="card front">
    <img src="../../03-logo/svg/lockup-horizontal.svg" alt="Menu Master NG">
    <div>
      <div class="name">Your Name</div>
      <div class="role">Founder, Menu Master NG</div>
    </div>
    <div class="contact">
      <div><span>WhatsApp</span> &nbsp;+234 000 000 0000</div>
      <div><span>Email</span> &nbsp;hello@menumasterng.com</div>
      <div><span>Web</span> &nbsp;menumasterng.com</div>
    </div>
  </div>
  <div class="card back">
    <img src="../../03-logo/svg/mark-reversed.svg" alt="">
    <p>Know your cost. Know your price. Know your profit.</p>
    <small>For Nigerian food businesses</small>
  </div>
</body></html>
