<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="render" content="1080x1080">
<title>Instagram post — photo + one line</title>
<link rel="stylesheet" href="../../_brand.css">
<style>
  body { width: 1080px; height: 1080px; overflow: hidden; position: relative; background: #0f5e3c; }
  .photo { position: absolute; inset: 0; background: url('../../06-imagery/samples/pexels-23490764.jpg') center/cover; }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(15 94 60 / .15) 0%, rgb(15 94 60 / .88) 62%, #0f5e3c 100%); }
  .card { position: absolute; left: 72px; right: 72px; bottom: 72px; color: #fff; }
  .kicker { font: 700 26px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: #d4a020; margin-bottom: 26px; }
  h1 { font-size: 96px; font-weight: 800; line-height: .98; }
  h1 em { font-style: normal; color: #d4a020; }
  p { font-size: 34px; line-height: 1.3; margin: 30px 0 0; max-width: 820px; color: rgb(255 255 255 / .9); }
  .brand { position: absolute; top: 64px; left: 72px; height: 64px; }
  .cta { position: absolute; top: 72px; right: 72px; background: #fff; color: #0f5e3c; font: 700 26px/1 var(--font-ui); padding: 20px 28px; border-radius: 999px; }
</style></head>
<body>
  <div class="photo"></div><div class="tint"></div>
  <img class="brand" src="../../03-logo/svg/lockup-horizontal-reversed.svg" alt="Menu Master NG" style="background:none">
  <div class="cta">14 days free</div>
  <div class="card">
    <div class="kicker">Market prices moved again</div>
    <h1>Tomatoes went up.<br><em>Did your price?</em></h1>
    <p>Record this morning's purchase and every dish that uses it is costed again. menumasterng.com</p>
  </div>
</body></html>
